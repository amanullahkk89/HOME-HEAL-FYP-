name: homeheal
description: HomeHeal — Smart Home Healthcare Assistance System for East-City Hospital (Flutter Android Client).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  socket_io_client: ^3.0.2
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  firebase_storage: ^12.3.7
  file_picker: ^8.1.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
